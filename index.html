<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>施工報告產生器 — 尚緯消防工程行</title>
    <meta name="description" content="尚緯消防工程行施工報告產生器：上傳施工照片、填寫說明，一鍵產生封面＋照片頁的 Word 施工報告。免安裝，資料只在您的瀏覽器處理。">
    <meta name="theme-color" content="#148A91">
    <meta property="og:title" content="施工報告產生器 — 尚緯消防工程行">
    <meta property="og:description" content="上傳施工照片，一鍵產生 Word 施工報告，免安裝。">
    <meta property="og:image" content="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <!-- 產生 Word 用的元件改為 defer，不再擋住畫面載入 -->
    <script defer src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root {
            --teal: #1EBCC5;
            --teal-dark: #148A91;
            --teal-deeper: #0E6266;
            --teal-light: #E6F7F8;
            --teal-glow: rgba(30, 188, 197, 0.15);
            --red: #EB0A1C;
            --red-light: #FDE8EA;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-500: #64748b;
            --slate-400: #94a3b8;
            --slate-300: #cbd5e1;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --white: #ffffff;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.07), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.1), 0 4px 12px rgba(0,0,0,0.05);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* 使用系統內建中文字型，免下載大型網路字型，手機開啟更快 */
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Segoe UI", sans-serif;
            background: var(--slate-100);
            min-height: 100vh;
            color: var(--slate-700);
            line-height: 1.6;
            -webkit-text-size-adjust: 100%;
        }

        button { font-family: inherit; }
        :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

        /* ===== Top Banner ===== */
        .top-banner {
            background: linear-gradient(135deg, var(--teal-deeper) 0%, var(--teal-dark) 40%, var(--teal) 100%);
            position: relative;
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
        }
        .top-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 600px 300px at 10% 80%, rgba(255,255,255,0.06), transparent),
                radial-gradient(ellipse 400px 400px at 90% 20%, rgba(255,255,255,0.04), transparent);
            pointer-events: none;
        }
        .top-banner-inner {
            max-width: 960px;
            margin: 0 auto;
            padding: 28px 32px 24px;
            display: flex;
            align-items: center;
            gap: 18px;
            position: relative;
        }
        .brand-icon {
            width: 48px; height: 48px;
            flex-shrink: 0;
            background: var(--white);
            border-radius: 12px;
            padding: 5px;
        }
        .brand-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .brand-text h1 { color: var(--white); font-size: 20px; font-weight: 700; letter-spacing: 0.02em; }
        .brand-text p { color: rgba(255,255,255,0.8); font-size: 13px; margin-top: 2px; }
        .brand-badge {
            background: rgba(255,255,255,0.18);
            color: var(--white);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            border: 1px solid rgba(255,255,255,0.1);
            margin-left: auto;
            flex-shrink: 0;
            white-space: nowrap;
        }

        /* ===== Main Container ===== */
        .main-container { max-width: 960px; margin: 0 auto; padding: 24px 16px 24px; }

        /* ===== Card ===== */
        .card {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--slate-200);
            margin-bottom: 16px;
            overflow: hidden;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 22px;
            border-bottom: 1px solid var(--slate-100);
        }
        .card-step {
            width: 28px; height: 28px;
            background: var(--teal);
            color: var(--white);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700;
            flex-shrink: 0;
        }
        .card-title { font-size: 15px; font-weight: 700; color: var(--slate-800); }
        .card-subtitle { font-size: 12px; color: var(--slate-400); margin-left: auto; }
        .card-body { padding: 20px 22px; }

        /* ===== Form Controls ===== */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group.full { grid-column: 1 / -1; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--slate-600); margin-bottom: 5px; }
        label .required { color: var(--red); margin-left: 2px; }
        .field-hint { font-weight: 400; color: var(--slate-400); font-size: 12px; margin-left: 4px; }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--slate-200);
            border-radius: var(--radius-sm);
            font-size: 16px; /* 16px 避免 iPhone 點輸入框時畫面自動放大 */
            font-family: inherit;
            color: var(--slate-800);
            background: var(--white);
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 3px var(--teal-glow);
        }
        input.invalid { border-color: var(--red); box-shadow: 0 0 0 3px rgba(235,10,28,0.12); }
        textarea { min-height: 110px; resize: vertical; line-height: 1.7; }
        input::placeholder, textarea::placeholder { color: var(--slate-400); }

        /* ===== Upload Zone ===== */
        .upload-zone {
            border: 2px dashed var(--slate-300);
            border-radius: var(--radius);
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color var(--transition), background var(--transition);
            background: var(--slate-50);
        }
        .upload-zone:hover, .upload-zone.active { border-color: var(--teal); background: var(--teal-light); }
        .upload-zone.busy { pointer-events: none; border-color: var(--teal); background: var(--teal-light); }
        .upload-zone .icon { font-size: 36px; margin-bottom: 8px; opacity: 0.8; }
        .upload-zone .text { font-size: 15px; font-weight: 600; color: var(--slate-600); }
        .upload-zone .hint { font-size: 12px; color: var(--slate-400); margin-top: 4px; }

        /* ===== Photo Status Bar ===== */
        .photo-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .photo-count-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--teal-light); color: var(--teal-dark);
            padding: 5px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
        }
        .photo-count-badge.warn { background: var(--red-light); color: #b80816; }
        .sort-hint { font-size: 12px; color: var(--slate-400); }

        /* ===== Photo Grid ===== */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 12px;
            padding-bottom: 4px;
        }
        .photo-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1.5px solid var(--slate-200);
            transition: border-color var(--transition), box-shadow var(--transition), opacity var(--transition);
            position: relative;
            cursor: grab;
        }
        .photo-card:hover { border-color: var(--teal); box-shadow: var(--shadow-md); }
        .photo-card.dragging { opacity: 0.4; cursor: grabbing; }
        .photo-card.drag-over { border-color: var(--teal); border-style: dashed; background: var(--teal-light); }
        .photo-card.missing { border-color: var(--red); }
        .photo-card .thumb {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
            pointer-events: none;
            background: var(--slate-100);
            user-select: none;
            -webkit-user-drag: none;
        }
        .photo-card .num {
            position: absolute;
            top: 8px; left: 8px;
            background: var(--slate-900);
            color: var(--white);
            min-width: 22px; height: 22px;
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700;
            padding: 0 6px;
            pointer-events: none;
            opacity: 0.85;
        }
        .photo-card .page-tag {
            position: absolute;
            bottom: 46px; left: 8px;
            background: rgba(255,255,255,0.9);
            color: var(--teal-deeper);
            font-size: 10px; font-weight: 600;
            padding: 1px 7px; border-radius: 8px;
            pointer-events: none;
        }
        .photo-card .actions {
            position: absolute;
            top: 6px; right: 6px;
            display: flex; gap: 4px;
            opacity: 0;
            transition: opacity var(--transition);
        }
        .photo-card:hover .actions, .photo-card:focus-within .actions { opacity: 1; }
        .photo-card .actions button {
            width: 28px; height: 28px;
            border-radius: 7px;
            border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: background var(--transition);
        }
        .btn-move { background: rgba(0,0,0,0.55); color: var(--white); }
        .btn-move:hover { background: var(--teal); }
        .btn-move:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-del { background: rgba(230,59,46,0.85); color: var(--white); }
        .btn-del:hover { background: var(--red); }
        .photo-card .caption-input {
            display: block;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 0;
            border-top: 1px solid var(--slate-100);
            font-size: 14px;
            font-family: inherit;
            color: var(--slate-700);
            background: var(--slate-50);
        }
        .photo-card .caption-input:focus { outline: none; background: var(--teal-light); border-top-color: var(--teal); box-shadow: none; }
        .photo-card .caption-input.filled { border-top-color: #48bb78; background: #f0fff4; }

        .empty-state { text-align: center; padding: 36px 20px; color: var(--slate-400); }
        .empty-state .icon { font-size: 40px; margin-bottom: 8px; opacity: 0.6; }
        .empty-state .text { font-size: 13px; }

        /* ===== Batch Caption ===== */
        .batch-caption-area { border-top: 1px solid var(--slate-100); padding: 14px 22px; display: none; }
        .batch-caption-area.show { display: block; }
        .batch-caption-row { display: flex; gap: 10px; align-items: center; }
        .batch-caption-row input { flex: 1; padding: 8px 12px; }
        .btn-teal {
            padding: 9px 16px;
            background: var(--teal-dark);
            color: var(--white);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background var(--transition);
        }
        .btn-teal:hover { background: var(--teal-deeper); }
        .batch-hint { font-size: 12px; color: var(--slate-400); margin-top: 6px; }

        /* ===== Options ===== */
        .option-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 22px;
            border-top: 1px solid var(--slate-100);
            font-size: 13px;
            color: var(--slate-600);
            flex-wrap: wrap;
        }
        .option-row .spacer { flex: 1; }
        .toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; margin: 0; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle .slider {
            position: absolute; inset: 0;
            background: var(--slate-300);
            border-radius: 10px;
            transition: background var(--transition);
            cursor: pointer;
        }
        .toggle .slider::before {
            content: '';
            position: absolute;
            width: 16px; height: 16px;
            left: 2px; top: 2px;
            background: var(--white);
            border-radius: 50%;
            transition: transform var(--transition);
        }
        .toggle input:checked + .slider { background: var(--teal); }
        .toggle input:checked + .slider::before { transform: translateX(16px); }
        .toggle input:focus-visible + .slider { outline: 2px solid var(--teal); outline-offset: 2px; }
        .btn-text {
            background: none;
            border: none;
            color: var(--slate-500);
            font-size: 13px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
        }
        .btn-text:hover { color: var(--red); background: var(--red-light); }

        /* ===== Generate Button（固定在畫面下方，照片多時不用捲到底） ===== */
        .generate-section {
            position: sticky;
            bottom: 0;
            z-index: 50;
            padding: 14px 0 calc(14px + env(safe-area-inset-bottom));
            background: linear-gradient(to top, var(--slate-100) 72%, rgba(241,245,249,0));
        }
        .btn-generate {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--teal-dark) 0%, var(--teal) 100%);
            color: var(--white);
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
            box-shadow: 0 4px 16px rgba(20,138,145,0.3);
        }
        .btn-generate:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(20,138,145,0.35); }
        .btn-generate:active { transform: translateY(0); }
        .btn-generate:disabled { opacity: 0.75; cursor: progress; transform: none; }
        .spinner {
            width: 18px; height: 18px;
            border: 2.5px solid rgba(255,255,255,0.35);
            border-top-color: var(--white);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: calc(20px + env(safe-area-inset-top));
            right: 20px;
            padding: 14px 20px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            transform: translateX(130%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-lg);
            max-width: 380px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { background: #065f46; color: var(--white); }
        .toast.error { background: #991b1b; color: var(--white); }
        .toast.info { background: var(--slate-800); color: var(--white); }

        /* ===== Footer ===== */
        .footer { text-align: center; padding: 8px 24px 28px; font-size: 12px; color: var(--slate-400); }
        .footer strong { color: var(--teal-dark); font-weight: 600; }
        .footer .privacy { margin-top: 4px; }
        .report-counter {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--teal-light); color: var(--teal-dark);
            padding: 6px 14px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
            margin-bottom: 10px;
        }

        /* 觸控裝置（手機、平板）沒有滑鼠移入，操作按鈕常駐顯示 */
        @media (hover: none) {
            .photo-card .actions { opacity: 1; }
            .photo-card { cursor: default; }
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            .top-banner-inner { padding: 20px 18px; gap: 12px; }
            .brand-text h1 { font-size: 17px; }
            .brand-badge { display: none; }
            .main-container { padding: 12px 10px 16px; }
            .card-header { padding: 14px 16px; }
            .card-body { padding: 16px; }
            .batch-caption-area, .option-row { padding-left: 16px; padding-right: 16px; }
            .form-grid { grid-template-columns: 1fr; }
            .photo-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .photo-card .thumb { height: 120px; }
            .photo-card .actions { opacity: 1; }
            .sort-hint { display: none; }
            .toast { left: 12px; right: 12px; max-width: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation-duration: 1.5s !important; }
        }
    </style>
</head>

            <div class="brand-text">
                <h1>施工報告產生器</h1>
                <p>封面 + 照片頁 ・ 自動排版下載 Word 檔</p>
            </div>
            <span class="brand-badge">DOCX</span>
        </div>

    <!-- ===== Content ===== -->
    <main class="main-container">

        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <!-- Section 1: Project Info -->
        <section class="card">
            <div class="card-header">
                <div class="card-step">1</div>
                <h2 class="card-title">工程資訊</h2>
                <span class="card-subtitle" id="draftStatus"></span>
            </div>
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="projectName">工程名稱 <span class="required">*</span></label>
                        <input type="text" id="projectName" autocomplete="off" enterkeyhint="next" placeholder="例：昌益國寶社區 — 消防灑水改善工程">
                    </div>
                    <div class="form-group">
                        <label for="reportDate">報告日期</label>
                        <input type="text" id="reportDate" autocomplete="off" enterkeyhint="next" placeholder="例：114年01月15日">
                    </div>
                    <div class="form-group">
                        <label for="workDate">施工日期 <span class="field-hint">（選填）</span></label>
                        <input type="text" id="workDate" autocomplete="off" enterkeyhint="next" placeholder="例：2025/01/01 ~ 01/31">
                    </div>
                    <div class="form-group full">
                        <label for="description">施工說明</label>
                        <textarea id="description" placeholder="請輸入施工說明內容..."></textarea>
                    </div>
                </div>
            </div>
        </section>

        <!-- Section 2: Photos -->
        <section class="card">
            <div class="card-header">
                <div class="card-step">2</div>
                <h2 class="card-title">施工照片</h2>
                <span class="card-subtitle" id="photoCountLabel"></span>
            </div>
            <div class="card-body">
                <div class="upload-zone" id="uploadZone" role="button" tabindex="0" aria-label="上傳施工照片">
                    <div class="icon">📷</div>
                    <div class="text" id="uploadText">點擊或拖曳照片上傳</div>
                    <div class="hint" id="uploadHint">支援 JPG / PNG，可多選批次上傳</div>
                    <input type="file" id="fileInput" multiple accept="image/*" hidden>
                </div>
                <div id="photoContainer">
                    <div class="empty-state" id="emptyPhotos">
                        <div class="icon">🖼️</div>
                        <div class="text">尚未上傳照片</div>
                    </div>
                </div>
            </div>
            <!-- Batch caption -->
            <div class="batch-caption-area" id="batchCaptionArea">
                <div class="batch-caption-row">
                    <input type="text" id="batchCaptionInput" autocomplete="off" placeholder="輸入統一說明文字...">
                    <button type="button" class="btn-teal" id="batchBtn">套用全部</button>
                </div>
                <div class="batch-hint">將說明文字套用至所有尚未填寫的照片（已有說明的不會被覆蓋）</div>
            </div>
            <!-- Options -->
            <div class="option-row" id="optionRow" style="display:none;">
                <label class="toggle" for="compressToggle">
                    <input type="checkbox" id="compressToggle" checked>
                    <span class="slider"></span>
                </label>
                <span>壓縮照片（檔案較小，適合 Email / LINE 傳送）</span>
                <span class="spacer"></span>
                <button type="button" class="btn-text" id="clearBtn">🗑 清除全部，開新報告</button>
            </div>
        </section>

        <!-- Generate -->
        <div class="generate-section">
            <button type="button" class="btn-generate" id="generateBtn">
                <span id="genIcon">📄</span><span id="genText">產生 Word 報告</span>
            </button>
        </div>

        <footer class="footer">
            <div class="report-counter" id="reportCounter" style="display:none"></div>
            <div><strong>尚緯消防工程行</strong> ・ 專業 • 品質 • 安全</div>
            <div class="privacy">照片與資料只在您的瀏覽器中處理與暫存，不會上傳到任何伺服器</div>
        </footer>
    </main>

        const binaryStr = atob(EMBEDDED_LOGO_B64);

    // ===== DOM Refs =====
    const $ = id => document.getElementById(id);
    const uploadZone = $('uploadZone');
    const fileInput = $('fileInput');
    const photoContainer = $('photoContainer');
    const emptyPhotos = $('emptyPhotos');
    const generateBtn = $('generateBtn');
    const toastEl = $('toast');

    // ===== Helpers =====
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function rocToday() {
        const d = new Date();
        return `${d.getFullYear() - 1911}年${String(d.getMonth() + 1).padStart(2, '0')}月${String(d.getDate()).padStart(2, '0')}日`;
    }
    const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

    // ===== Toast =====
    let toastTimer;
    function showToast(msg, type = 'success', ms = 3500) {
        clearTimeout(toastTimer);
        toastEl.textContent = msg;
        toastEl.className = `toast ${type}`;
        requestAnimationFrame(() => toastEl.classList.add('show'));
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
    }

    // ===== Report Counter (localStorage) =====
    function getReportCount() {
        try { return parseInt(localStorage.getItem('sw_report_count') || '0', 10); } catch (e) { return 0; }
    }
    function incrementReportCount() {
        try { localStorage.setItem('sw_report_count', String(getReportCount() + 1)); } catch (e) {}
        updateCounterDisplay();
    }
    function updateCounterDisplay() {
        const count = getReportCount();
        const el = $('reportCounter');
        el.textContent = count > 0 ? '📊 已累計產生 ' + count + ' 份報告' : '';
        el.style.display = count > 0 ? '' : 'none';
    }

    // ===== 照片暫存（IndexedDB）：重新整理或不小心關掉分頁，照片和說明都還在 =====
    const Store = (() => {
        let dbp = null;
        function open() {
            if (!dbp) dbp = new Promise((resolve, reject) => {
                if (!('indexedDB' in window)) return reject(new Error('no indexedDB'));
                const req = indexedDB.open('sw-report-draft', 1);
                req.onupgradeneeded = () => req.result.createObjectStore('blobs');
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
            return dbp;
        }
        async function run(mode, fn) {
            const db = await open();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('blobs', mode);
                const req = fn(tx.objectStore('blobs'));
                tx.oncomplete = () => resolve(req ? req.result : undefined);
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error);
            });
        }
        return {
            put: (key, val) => run('readwrite', s => s.put(val, key)),
            get: key => run('readonly', s => s.get(key)),
            del: key => run('readwrite', s => { s.delete(key + '_t'); return s.delete(key); }),
            clear: () => run('readwrite', s => s.clear())
        };
    })();

    function persistFail() {
        if (!persistOK) return;
        persistOK = false;
        showToast('瀏覽器暫存空間不足，照片不會自動保存，請在產生報告前不要重新整理頁面', 'error', 6000);
    }

    let saveTimer;
    function saveDraft() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
            try {
                const d = { compress: $('compressToggle').checked };
                FIELDS.forEach(f => d[f] = $(f).value);
                d.photos = photos.map(p => ({ id: p.id, name: p.name, caption: p.caption, width: p.width, height: p.height }));
                localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
                $('draftStatus').textContent = '✓ 已自動保存';
            } catch (e) { /* localStorage 不可用時略過 */ }
        }, 400);
    }

    async function restoreDraft() {
        let d = null;
        try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {}
        if (d) {
            FIELDS.forEach(f => { if (d[f]) $(f).value = d[f]; });
            if (typeof d.compress === 'boolean') $('compressToggle').checked = d.compress;
        }
        if (!$('reportDate').value) $('reportDate').value = rocToday();
        if (!d || !Array.isArray(d.photos) || !d.photos.length) return;

        let restored = 0;
        for (const m of d.photos) {
            try {
                const file = await Store.get(m.id);
                if (!file) continue;
                const thumb = await Store.get(m.id + '_t');
                photos.push({ ...m, caption: m.caption || '', file, thumbUrl: URL.createObjectURL(thumb || file) });
                restored++;
            } catch (e) { persistOK = false; break; }
        }
        renderPhotos();
        if (restored) {
            showToast(`已還原上次未完成的草稿（${restored} 張照片）`, 'info', 4500);
            $('draftStatus').textContent = '✓ 已還原草稿';
        }
    }

    // ===== 圖片處理 =====
    // 透過 <img> 解碼：瀏覽器會自動依照手機照片的 EXIF 方向轉正
    function decodeImage(blob) {
        return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = () => resolve({ img, release() { URL.revokeObjectURL(url); img.src = ''; } });
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode failed')); };
            img.src = url;
        });
    }

    // 重新編碼為 JPEG（同時把方向轉正、限制尺寸）
    function encodeJpeg(img, maxDim, quality) {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > maxDim || h > maxDim) {
            const r = Math.min(maxDim / w, maxDim / h);
            w = Math.round(w * r); h = Math.round(h * r);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        return new Promise((resolve, reject) => {
            canvas.toBlob(blob => {
                canvas.width = canvas.height = 0; // 釋放記憶體（iPhone 上很重要）
                blob ? resolve({ blob, width: w, height: h }) : reject(new Error('encode failed'));
            }, 'image/jpeg', quality);
        });
    }

    // ===== Upload =====
    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('active'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('active'));
    fileInput.addEventListener('change', e => { handleFiles(e.target.files); fileInput.value = ''; });

    // 照片拖到頁面任何地方都當作上傳，避免瀏覽器直接開啟圖片而跳離頁面、資料遺失
    const isFileDrag = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
    document.addEventListener('dragover', e => { if (isFileDrag(e)) e.preventDefault(); });
    document.addEventListener('drop', e => {
        if (!isFileDrag(e)) return;
        e.preventDefault();
        uploadZone.classList.remove('active');
        handleFiles(e.dataTransfer.files);
    });

    let uploading = false;
    async function handleFiles(fileList) {
        const files = Array.from(fileList || []).filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|heic|heif|webp)$/i.test(f.name));
        if (!files.length || uploading) return;
        uploading = true;
        uploadZone.classList.add('busy');
        const failed = [];
        let added = 0;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            $('uploadText').textContent = `處理照片中… ${i + 1} / ${files.length}`;
            $('uploadHint').textContent = file.name;
            try {
                const dec = await decodeImage(file);
                const width = dec.img.naturalWidth, height = dec.img.naturalHeight;
                const thumb = await encodeJpeg(dec.img, 480, 0.8);
                dec.release();
                const id = 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
                const photo = { id, name: file.name, file, thumbUrl: URL.createObjectURL(thumb.blob), caption: '', width, height };
                photos.push(photo);
                added++;
                if (persistOK) Promise.all([Store.put(id, file), Store.put(id + '_t', thumb.blob)]).catch(persistFail);
            } catch (err) {
                failed.push(file.name);
            }
            if (i % 6 === 5) { renderPhotos(); await nextFrame(); }
        }

        uploading = false;
        uploadZone.classList.remove('busy');
        $('uploadText').textContent = '點擊或拖曳照片上傳';
        $('uploadHint').textContent = '支援 JPG / PNG，可多選批次上傳';
        renderPhotos();
        saveDraft();

        if (failed.length) {
            showToast(`有 ${failed.length} 張無法讀取（${failed.slice(0, 3).join('、')}${failed.length > 3 ? '…' : ''}），請改用 JPG 或 PNG`, 'error', 6000);
        } else if (added) {
            showToast(`已加入 ${added} 張照片`);
        }
    }

    // ===== Render Photos =====
    function renderPhotos() {
        const count = photos.length;
        const missing = photos.filter(p => !p.caption.trim()).length;
        const pages = Math.ceil(count / 4);
        $('photoCountLabel').textContent = count ? `${count} 張 ・ ${pages} 頁` : '';
        $('batchCaptionArea').classList.toggle('show', count > 0);
        $('optionRow').style.display = count > 0 ? '' : 'none';

        if (count === 0) {
            photoContainer.innerHTML = '';
            photoContainer.appendChild(emptyPhotos);
            emptyPhotos.style.display = '';
            return;
        }

        const badge = missing
            ? `<span class="photo-count-badge warn">✏️ 還有 ${missing} 張未填說明</span>`
            : `<span class="photo-count-badge">✅ 共 ${count} 張，說明皆已填寫</span>`;
        let html = `<div class="photo-status">${badge}<span class="sort-hint">拖曳卡片或按箭頭排序 ・ 說明欄按 Enter 跳下一張</span></div><div class="photo-grid">`;
        photos.forEach((p, i) => {
            const filled = p.caption.trim() ? ' filled' : '';
            const pageTag = i % 4 === 0 ? `<span class="page-tag">第 ${Math.floor(i / 4) + 1} 頁</span>` : '';
            html += `<div class="photo-card" data-index="${i}" draggable="true">
                <span class="num">${i + 1}</span>
                <div class="actions">
                    <button type="button" class="btn-move" data-act="move" data-dir="-1" ${i === 0 ? 'disabled' : ''} title="往前移" aria-label="第 ${i + 1} 張往前移">◀</button>
                    <button type="button" class="btn-move" data-act="move" data-dir="1" ${i === count - 1 ? 'disabled' : ''} title="往後移" aria-label="第 ${i + 1} 張往後移">▶</button>
                    <button type="button" class="btn-del" data-act="del" title="刪除" aria-label="刪除第 ${i + 1} 張">✕</button>
                </div>
                <img class="thumb" src="${p.thumbUrl}" alt="${escapeHtml(p.name)}" decoding="async" draggable="false">
                ${pageTag}
                <input class="caption-input${filled}" type="text" id="cap_${p.id}" data-id="${p.id}" autocomplete="off" enterkeyhint="next"
                    placeholder="輸入照片說明..." aria-label="第 ${i + 1} 張照片說明" value="${escapeHtml(p.caption)}">
            </div>`;
        });
        html += '</div>';
        photoContainer.innerHTML = html;
    }

    function updateStatusBadge() {
        const badgeEl = photoContainer.querySelector('.photo-count-badge');
        if (!badgeEl) return;
        const missing = photos.filter(p => !p.caption.trim()).length;
        badgeEl.className = 'photo-count-badge' + (missing ? ' warn' : '');
        badgeEl.textContent = missing ? `✏️ 還有 ${missing} 張未填說明` : `✅ 共 ${photos.length} 張，說明皆已填寫`;
    }

    // ===== 事件委派：按鈕、說明輸入、Enter 跳下一張 =====
    photoContainer.addEventListener('click', e => {
        const btn = e.target.closest('button[data-act]');
        if (!btn) return;
        const i = +btn.closest('.photo-card').dataset.index;
        if (btn.dataset.act === 'move') movePhoto(i, +btn.dataset.dir);
        else if (btn.dataset.act === 'del') deletePhoto(i);
    });
    photoContainer.addEventListener('input', e => {
        if (!e.target.classList.contains('caption-input')) return;
        const p = photos.find(x => x.id === e.target.dataset.id);
        if (!p) return;
        p.caption = e.target.value;
        e.target.classList.toggle('filled', p.caption.trim() !== '');
        e.target.closest('.photo-card').classList.remove('missing');
        updateStatusBadge();
        saveDraft();
    });
    photoContainer.addEventListener('keydown', e => {
        if (e.key !== 'Enter' || e.isComposing || !e.target.classList.contains('caption-input')) return;
        e.preventDefault();
        const inputs = Array.from(photoContainer.querySelectorAll('.caption-input'));
        const next = inputs[inputs.indexOf(e.target) + 1];
        if (next) { next.focus(); next.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        else e.target.blur();
    });

    // ===== Drag & Drop 排序（滑鼠） =====
    photoContainer.addEventListener('dragstart', e => {
        const card = e.target.closest && e.target.closest('.photo-card');
        if (!card || e.target.classList.contains('caption-input')) return;
        draggedIndex = +card.dataset.index;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(draggedIndex));
    });
    photoContainer.addEventListener('dragend', () => {
        photoContainer.querySelectorAll('.photo-card').forEach(c => c.classList.remove('dragging', 'drag-over'));
        draggedIndex = null;
    });
    photoContainer.addEventListener('dragover', e => {
        if (draggedIndex === null) return;
        const card = e.target.closest('.photo-card');
        if (!card) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        photoContainer.querySelectorAll('.drag-over').forEach(c => { if (c !== card) c.classList.remove('drag-over'); });
        if (+card.dataset.index !== draggedIndex) card.classList.add('drag-over');
    });
    photoContainer.addEventListener('drop', e => {
        if (draggedIndex === null) return;
        const card = e.target.closest('.photo-card');
        if (!card) return;
        e.preventDefault();
        e.stopPropagation();
        const target = +card.dataset.index;
        if (draggedIndex !== target) {
            const [moved] = photos.splice(draggedIndex, 1);
            photos.splice(target, 0, moved);
            draggedIndex = null;
            renderPhotos();
            saveDraft();
        }
    });

    function movePhoto(i, dir) {
        const j = i + dir;
        if (j < 0 || j >= photos.length) return;
        [photos[i], photos[j]] = [photos[j], photos[i]];
        renderPhotos();
        saveDraft();
        const btn = photoContainer.querySelector(`.photo-card[data-index="${j}"] button[data-dir="${dir}"]`);
        if (btn && !btn.disabled) btn.focus();
    }

    function deletePhoto(i) {
        const [p] = photos.splice(i, 1);
        if (!p) return;
        URL.revokeObjectURL(p.thumbUrl);
        Store.del(p.id).catch(() => {});
        renderPhotos();
        saveDraft();
    }

    function clearAll() {
        if (!confirm('確定要清除目前所有照片與填寫內容，開始一份新報告嗎？')) return;
        photos.forEach(p => URL.revokeObjectURL(p.thumbUrl));
        photos = [];
        Store.clear().catch(() => {});
        FIELDS.forEach(f => $(f).value = '');
        $('reportDate').value = rocToday();
        $('batchCaptionInput').value = '';
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
        $('draftStatus').textContent = '';
        renderPhotos();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast('已清除，可以開始新的報告', 'info');
    }

    function applyBatchCaption() {
        const val = $('batchCaptionInput').value.trim();
        if (!val) { $('batchCaptionInput').focus(); return; }
        let applied = 0;
        photos.forEach(p => { if (!p.caption.trim()) { p.caption = val; applied++; } });
        renderPhotos();
        saveDraft();
        showToast(applied ? `已套用 ${applied} 張照片的說明` : '所有照片已有說明，未做變更', applied ? 'success' : 'info');
    }

    $('batchBtn').addEventListener('click', applyBatchCaption);
    $('batchCaptionInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); applyBatchCaption(); } });
    $('clearBtn').addEventListener('click', clearAll);
    $('compressToggle').addEventListener('change', saveDraft);
    FIELDS.forEach(f => $(f).addEventListener('input', () => { $(f).classList.remove('invalid'); saveDraft(); }));
    // 工程資訊欄位按 Enter 跳下一格
    ['projectName', 'reportDate', 'workDate'].forEach((f, i, arr) => {
        $(f).addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $(arr[i + 1] || 'description').focus(); }
        });
    });
    generateBtn.addEventListener('click', generateReport);

    // 照片無法暫存時，離開頁面前提醒
    window.addEventListener('beforeunload', e => {
        if (photos.length && !persistOK) { e.preventDefault(); e.returnValue = ''; }
    });

    // ===== EMU Helpers =====
    function calcScaledEMU(w, h, maxW, maxH) {
        const r = Math.min(maxW / w, maxH / h);
        return { width: Math.round(w * r), height: Math.round(h * r) };
    }
    function emuToPx(emu) { return Math.round(emu / 914400 * 96); }

    function setGenerating(on, text) {
        generateBtn.disabled = on;
        $('genIcon').innerHTML = on ? '<span class="spinner"></span>' : '📄';
        $('genText').textContent = text || '產生 Word 報告';
    }

    // ===== Generate Report =====
    let generating = false;
    async function generateReport() {
        if (generating) return;
        if (!window.docx || !window.saveAs) {
            showToast('產生報告的元件還在載入，請稍等幾秒再按一次', 'error');
            return;
        }
        const { Document, Packer, Paragraph, TextRun, ImageRun, Table, TableRow, TableCell,
                Header, Footer, AlignmentType, PageBreak, WidthType, BorderStyle,
                VerticalAlign, ShadingType, PageNumber } = window.docx;

        const projectName = $('projectName').value.trim();
        const reportDate = $('reportDate').value.trim() || rocToday();
        const workDate = $('workDate').value.trim();
        const description = $('description').value.trim();
        const shouldCompress = $('compressToggle').checked;

        if (!projectName) {
            showToast('請填寫工程名稱', 'error');
            $('projectName').classList.add('invalid');
            $('projectName').focus();
            $('projectName').scrollIntoView({ block: 'center', behavior: 'smooth' });
            return;
        }
        if (!photos.length) { showToast('請上傳至少一張照片', 'error'); uploadZone.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
        const mi = photos.findIndex(p => !p.caption.trim());
        if (mi >= 0) {
            const missingCount = photos.filter(p => !p.caption.trim()).length;
            showToast(`第 ${mi + 1} 張照片還沒填說明${missingCount > 1 ? `（共 ${missingCount} 張未填）` : ''}`, 'error');
            photoContainer.querySelectorAll('.photo-card').forEach((c, i) => c.classList.toggle('missing', !photos[i].caption.trim()));
            const el = document.getElementById('cap_' + photos[mi].id);
            if (el) { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
            return;
        }

        generating = true;
        setGenerating(true, '準備中…');
        await nextFrame();

        try {
            // 每張照片重新編碼：轉正方向、控制大小
            const maxDim = shouldCompress ? 1600 : 2400;
            const quality = shouldCompress ? 0.82 : 0.9;
            const processedPhotos = [];
            for (let i = 0; i < photos.length; i++) {
                setGenerating(true, `處理照片 ${i + 1} / ${photos.length}…`);
                const p = photos[i];
                let dec;
                try { dec = await decodeImage(p.file); }
                catch (e) { throw new Error(`第 ${i + 1} 張照片（${p.name}）無法讀取，請刪除後重新上傳`); }
                const out = await encodeJpeg(dec.img, maxDim, quality);
                dec.release();
                processedPhotos.push({ ...p, buffer: await out.blob.arrayBuffer(), width: out.width, height: out.height, type: 'jpg' });
                if (i % 4 === 3) await nextFrame();
            }
            setGenerating(true, '正在產生 Word 報告…');
            await nextFrame();

            // ===== Brand Colors (from logo) =====
            // Primary Teal: #1EBCC5  |  Dark Teal: #148A91  |  Deep Teal: #0E6266
            // Accent Red:   #EB0A1C  |  Dark Red:  #B80816
            const C = {
                TEAL:       "1EBCC5",
                TEAL_DARK:  "148A91",
                TEAL_DEEP:  "0E6266",
                TEAL_BG:    "E6F7F8",   // very light teal for backgrounds
                TEAL_BG2:   "D0F0F2",   // slightly deeper teal bg
                RED:        "EB0A1C",
                RED_DARK:   "B80816",
                RED_BG:     "FDE8EA",
                WHITE:      "FFFFFF",
                BLACK:      "1A1A1A",
                GRAY_DARK:  "3D3D3D",
                GRAY:       "666666",
                GRAY_LIGHT: "999999",
                GRAY_LINE:  "D0D0D0",
                GRAY_BG:    "F5F5F5",
            };

            // Border helpers
            const border = (color, size = 1) => ({ style: BorderStyle.SINGLE, size, color });
            const noBdr = { style: BorderStyle.NONE, size: 0, color: C.WHITE };
            const noBorders = { top: noBdr, bottom: noBdr, left: noBdr, right: noBdr };
            const tealBorders = { top: border(C.TEAL, 1), bottom: border(C.TEAL, 1), left: border(C.TEAL, 1), right: border(C.TEAL, 1) };
            const lightBorders = { top: border(C.GRAY_LINE, 1), bottom: border(C.GRAY_LINE, 1), left: border(C.GRAY_LINE, 1), right: border(C.GRAY_LINE, 1) };
            const font = "微軟正黑體";

            // Dimensions (EMU)
            const coverLogoWEMU = 1143000, coverLogoHEMU = 1333500;
            const photoWEMU = 2095500, photoHEMU = 2790825;
            const headerLogoWEMU = 450000, headerLogoHEMU = 525000;

            // ============================================================
            // ===== COVER PAGE — refined brand layout =====
            // ============================================================
            const cover = [];

            // Top spacing
            cover.push(new Paragraph({ spacing: { before: 200 }, children: [] }));

            // Logo (embedded, centered)
            const ls = calcScaledEMU(coverLogoWEMU, coverLogoHEMU, coverLogoWEMU, coverLogoHEMU);
            cover.push(new Paragraph({
                alignment: AlignmentType.CENTER,
                spacing: { after: 80 },
                children: [new ImageRun({ type: logoData.type, data: logoData.data, transformation: { width: emuToPx(ls.width), height: emuToPx(ls.height) } })]
            }));

            // Company name
            cover.push(new Paragraph({
                alignment: AlignmentType.CENTER,
                spacing: { before: 40, after: 20 },
                children: [new TextRun({ text: "尚緯消防工程行", bold: true, size: 40, color: C.TEAL_DARK, font })]
            }));

            // Slogan
            cover.push(new Paragraph({
                alignment: AlignmentType.CENTER,
                spacing: { after: 60 },
                children: [new TextRun({ text: "專業 • 品質 • 安全", size: 20, color: C.RED, font })]
            }));

            // ── Red accent line ──
            cover.push(new Paragraph({
                alignment: AlignmentType.CENTER,
                spacing: { after: 80 },
                children: [new TextRun({ text: "━━━━━━━━━━", color: C.RED, size: 16 })]
            }));

            // ── Title block: 「施工報告書」inside teal banner ──
            const titleTable = new Table({
                alignment: AlignmentType.CENTER,
                columnWidths: [9360],
                rows: [new TableRow({
                    children: [new TableCell({
                        width: { size: 9360, type: WidthType.DXA },
                        borders: noBorders,
                        shading: { fill: C.TEAL, type: ShadingType.CLEAR },
                        verticalAlign: VerticalAlign.CENTER,
                        children: [new Paragraph({
                            alignment: AlignmentType.CENTER,
                            spacing: { before: 200, after: 200 },
                            children: [new TextRun({ text: "施 工 報 告 書", bold: true, size: 64, color: C.WHITE, font })]
                        })]
                    })]
                })]
            });
            cover.push(titleTable);

            cover.push(new Paragraph({ spacing: { before: 400 }, children: [] }));

            // ── Info table (teal left column, white right) ──
            const infoRows = [["工程名稱", projectName], ["報告日期", reportDate]];
            if (workDate) infoRows.push(["施工日期", workDate]);

            const infoTable = new Table({
                alignment: AlignmentType.CENTER,
                columnWidths: [2400, 6960],
                rows: infoRows.map(([label, value], idx) => new TableRow({
                    children: [
                        new TableCell({
                            width: { size: 2400, type: WidthType.DXA },
                            borders: { top: border(C.TEAL, 1), bottom: border(C.TEAL, 1), left: border(C.TEAL, 4), right: border(C.TEAL, 1) },
                            shading: { fill: C.TEAL_DEEP, type: ShadingType.CLEAR },
                            verticalAlign: VerticalAlign.CENTER,
                            children: [new Paragraph({
                                alignment: AlignmentType.CENTER,
                                spacing: { before: 130, after: 130 },
                                children: [new TextRun({ text: label, bold: true, color: C.WHITE, size: 24, font })]
                            })]
                        }),
                        new TableCell({
                            width: { size: 6960, type: WidthType.DXA },
                            borders: { top: border(C.TEAL, 1), bottom: border(C.TEAL, 1), left: border(C.TEAL, 1), right: border(C.TEAL, 1) },
                            shading: { fill: C.TEAL_BG, type: ShadingType.CLEAR },
                            verticalAlign: VerticalAlign.CENTER,
                            children: [new Paragraph({
                                alignment: AlignmentType.CENTER,
                                spacing: { before: 130, after: 130 },
                                children: [new TextRun({ text: value, size: 24, color: C.BLACK, font })]
                            })]
                        })
                    ]
                }))
            });
            cover.push(infoTable);

            cover.push(new Paragraph({ spacing: { before: 400 }, children: [] }));

            // ── Section heading helper ──
            function sectionHeading(text) {
                return new Table({
                    alignment: AlignmentType.CENTER,
                    columnWidths: [9360],
                    rows: [new TableRow({
                        children: [new TableCell({
                            width: { size: 9360, type: WidthType.DXA },
                            borders: { top: noBdr, bottom: border(C.TEAL, 6), left: border(C.RED, 8), right: noBdr },
                            shading: { fill: C.GRAY_BG, type: ShadingType.CLEAR },
                            children: [new Paragraph({
                                spacing: { before: 100, after: 100 },
                                indent: { left: 200 },
                                children: [
                                    new TextRun({ text: text, bold: true, size: 26, color: C.TEAL_DARK, font })
                                ]
                            })]
                        })]
                    })]
                });
            }

            // ── 一、施工說明 ──
            cover.push(sectionHeading("一、施工說明"));
            cover.push(new Paragraph({ spacing: { before: 120 }, children: [] }));

            const descTable = new Table({
                alignment: AlignmentType.CENTER,
                columnWidths: [9360],
                rows: [new TableRow({
                    height: { value: 4200, rule: "atLeast" },
                    children: [new TableCell({
                        width: { size: 9360, type: WidthType.DXA },
                        borders: lightBorders,
                        children: [new Paragraph({
                            spacing: { before: 200, after: 200 },
                            indent: { left: 240, right: 240 },
                            children: [new TextRun({ text: description || "（請填入施工說明內容）", size: 22, color: description ? C.BLACK : C.GRAY_LIGHT, font })]
                        })]
                    })]
                })]
            });
            cover.push(descTable);

            cover.push(new Paragraph({ spacing: { before: 400 }, children: [] }));

            // ── 二、施工照片(如下頁) ──
            cover.push(sectionHeading("二、施工照片（如下頁）"));


            // ============================================================
            // ===== PHOTO PAGES — redesigned with brand colors =====
            // ============================================================
            const photoPages = [];

            for (let ps = 0; ps < processedPhotos.length; ps += 4) {
                if (ps > 0) photoPages.push(new Paragraph({ children: [new PageBreak()] }));
                const page = processedPhotos.slice(ps, ps + 4);
                const rows = [];

                for (let i = 0; i < page.length; i += 2) {
                    const p1 = page[i], p2 = page[i + 1];
                    const photoCells = [], captionCells = [];

                    // Helper: create photo cell
                    function makePhotoCell(photo) {
                        if (!photo) return new TableCell({
                            width: { size: 4680, type: WidthType.DXA },
                            borders: lightBorders,
                            children: [new Paragraph({ children: [] })]
                        });
                        const sc = calcScaledEMU(photo.width, photo.height, photoWEMU, photoHEMU);
                        return new TableCell({
                            width: { size: 4680, type: WidthType.DXA },
                            borders: { top: border(C.TEAL, 2), bottom: border(C.GRAY_LINE, 1), left: border(C.TEAL, 2), right: border(C.TEAL, 2) },
                            verticalAlign: VerticalAlign.CENTER,
                            children: [new Paragraph({
                                alignment: AlignmentType.CENTER,
                                spacing: { before: 40, after: 40 },
                                children: [new ImageRun({ type: photo.type, data: photo.buffer, transformation: { width: emuToPx(sc.width), height: emuToPx(sc.height) } })]
                            })]
                        });
                    }

                    // Helper: create caption cell
                    function makeCaptionCell(photo) {
                        if (!photo) return new TableCell({
                            width: { size: 4680, type: WidthType.DXA },
                            borders: lightBorders,
                            shading: { fill: C.TEAL_BG, type: ShadingType.CLEAR },
                            children: [new Paragraph({ children: [] })]
                        });
                        return new TableCell({
                            width: { size: 4680, type: WidthType.DXA },
                            borders: { top: border(C.GRAY_LINE, 1), bottom: border(C.TEAL, 2), left: border(C.TEAL, 2), right: border(C.TEAL, 2) },
                            shading: { fill: C.TEAL_BG, type: ShadingType.CLEAR },
                            verticalAlign: VerticalAlign.CENTER,
                            children: [new Paragraph({
                                alignment: AlignmentType.CENTER,
                                spacing: { before: 80, after: 80 },
                                children: [new TextRun({ text: photo.caption, size: 20, color: C.TEAL_DEEP, font })]
                            })]
                        });
                    }

                    photoCells.push(makePhotoCell(p1), makePhotoCell(p2));
                    captionCells.push(makeCaptionCell(p1), makeCaptionCell(p2));

                    rows.push(new TableRow({ height: { value: 5102, rule: "atLeast" }, children: photoCells }));
                    rows.push(new TableRow({ height: { value: 1000, rule: "atLeast" }, children: captionCells }));
                }

                photoPages.push(new Table({ alignment: AlignmentType.CENTER, columnWidths: [4680, 4680], rows }));
            }


            // ============================================================
            // ===== HEADER — brand bar =====
            // ============================================================
            const headerTable = new Table({
                alignment: AlignmentType.CENTER,
                columnWidths: [1600, 5760, 2000],
                rows: [new TableRow({
                    children: [
                        // Logo
                        new TableCell({
                            width: { size: 1600, type: WidthType.DXA }, borders: noBorders,
                            verticalAlign: VerticalAlign.CENTER,
                            children: [new Paragraph({
                                children: [new ImageRun({ type: logoData.type, data: logoData.data, transformation: { width: emuToPx(headerLogoWEMU), height: emuToPx(headerLogoHEMU) } })]
                            })]
                        }),
                        // Company name
                        new TableCell({
                            width: { size: 5760, type: WidthType.DXA }, borders: noBorders,
                            verticalAlign: VerticalAlign.CENTER,
                            children: [
                                new Paragraph({
                                    alignment: AlignmentType.CENTER,
                                    children: [new TextRun({ text: "尚緯消防工程行", bold: true, color: C.TEAL_DARK, size: 28, font })]
                                }),
                                new Paragraph({
                                    alignment: AlignmentType.CENTER,
                                    spacing: { before: 20 },
                                    children: [new TextRun({ text: "SHANG WEI XIAO FANG", color: C.GRAY_LIGHT, size: 14, font })]
                                })
                            ]
                        }),
                        // Slogan
                        new TableCell({
                            width: { size: 2000, type: WidthType.DXA }, borders: noBorders,
                            verticalAlign: VerticalAlign.CENTER,
                            children: [new Paragraph({
                                alignment: AlignmentType.RIGHT,
                                children: [new TextRun({ text: "專業 • 品質 • 安全", color: C.RED, size: 16, font })]
                            })]
                        })
                    ]
                })]
            });

            const photoHeader = new Header({
                children: [
                    headerTable,
                    // Dual-color header line: teal thick + red thin
                    new Paragraph({
                        border: { bottom: { style: BorderStyle.SINGLE, size: 14, color: C.TEAL } },
                        spacing: { after: 40 },
                        children: []
                    }),
                    new Paragraph({
                        border: { bottom: { style: BorderStyle.SINGLE, size: 4, color: C.RED } },
                        spacing: { after: 200 },
                        children: []
                    })
                ]
            });


            // ============================================================
            // ===== FOOTER — page number with brand accent =====
            // ============================================================
            const photoFooter = new Footer({
                children: [
                    new Paragraph({
                        border: { top: { style: BorderStyle.SINGLE, size: 4, color: C.RED } },
                        children: []
                    }),
                    new Paragraph({
                        border: { top: { style: BorderStyle.SINGLE, size: 8, color: C.TEAL } },
                        children: []
                    }),
                    new Paragraph({
                        alignment: AlignmentType.CENTER,
                        spacing: { before: 80 },
                        children: [
                            new TextRun({ text: "尚緯消防工程行", color: C.GRAY_LIGHT, size: 14, font }),
                            new TextRun({ text: "    |    ", color: C.GRAY_LINE, size: 14, font }),
                            new TextRun({ text: "第 ", color: C.GRAY, size: 16, font }),
                            new TextRun({ children: [PageNumber.CURRENT], bold: true, color: C.TEAL_DARK, size: 16, font }),
                            new TextRun({ text: " 頁，共 ", color: C.GRAY, size: 16, font }),
                            new TextRun({ children: [PageNumber.TOTAL_PAGES], bold: true, color: C.TEAL_DARK, size: 16, font }),
                            new TextRun({ text: " 頁", color: C.GRAY, size: 16, font })
                        ]
                    })
                ]
            });


            // ============================================================
            // ===== Assemble Document =====
            // ============================================================
            const doc = new Document({
                sections: [
                    // Cover page (no header/footer)
                    {
                        properties: { page: { margin: { top: 720, right: 720, bottom: 720, left: 720 } } },
                        children: cover
                    },
                    // Photo pages (with brand header + footer)
                    {
                        properties: { page: { margin: { top: 1200, right: 720, bottom: 720, left: 720 } } },
                        headers: { default: photoHeader },
                        footers: { default: photoFooter },
                        children: photoPages
                    }
                ]
            });

            const blob = await Packer.toBlob(doc);
            const safeName = projectName.substring(0, 20).replace(/[\\/:*?"<>|\s]/g, '');
            const d = new Date();
            const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            saveAs(blob, `施工報告_${safeName}_${stamp}.docx`);
            incrementReportCount();
            showToast(`✅ 報告已產生並下載（${photos.length} 張照片，${(blob.size / 1048576).toFixed(1)} MB）`, 'success', 5000);
        } catch (err) {
            console.error('產生報告錯誤:', err);
            showToast('❌ 產生報告時發生錯誤：' + err.message, 'error', 7000);
        } finally {
            generating = false;
            setGenerating(false);
        }
    }

    // ===== 啟動 =====
    updateCounterDisplay();
    restoreDraft();
    </script>
    <!-- Vercel Web Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
